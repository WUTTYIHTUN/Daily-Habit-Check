<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一日の習慣チェック & 週間チャート</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap');
        
        body {
            font-family: 'Plus Jakarta Sans', 'Noto Sans JP', sans-serif;
            background: linear-gradient(135deg, #f0f4f8 0%, #e2e8f0 100%);
            min-height: 100vh;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        .check-card {
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .check-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px -4px rgba(79, 70, 229, 0.12);
        }

        .custom-checkbox {
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .check-card.checked .custom-checkbox {
            background-color: #6366f1;
            border-color: #6366f1;
            transform: scale(1.05);
        }

        .check-card.checked .check-icon {
            opacity: 1;
            transform: scale(1) rotate(0deg);
        }

        .check-icon {
            opacity: 0;
            transform: scale(0.5) rotate(-45deg);
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .progress-glow {
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.4);
        }

        @keyframes pulse-subtle {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }

        .celebrate-bounce {
            animation: pulse-subtle 2s infinite ease-in-out;
        }
    </style>
</head>
<body class="py-6 px-4 sm:px-6 flex justify-center items-start">

    <div class="w-full max-w-lg mx-auto pb-12">
        
        <!-- Header Card -->
        <div class="glass-card rounded-3xl p-6 shadow-xl mb-6 text-slate-800 relative overflow-hidden">
            <div class="absolute top-0 right-0 -mt-6 -mr-6 w-32 h-32 bg-indigo-500/10 rounded-full blur-2xl pointer-events-none"></div>
            <div class="absolute bottom-0 left-0 -mb-6 -ml-6 w-32 h-32 bg-emerald-500/10 rounded-full blur-2xl pointer-events-none"></div>

            <div class="flex justify-between items-start mb-4">
                <div>
                    <div class="flex items-center gap-2 mb-1">
                        <span class="inline-block w-2.5 h-2.5 rounded-full bg-emerald-500"></span>
                        <span id="dateDisplay" class="text-xs sm:text-sm font-semibold tracking-wider text-slate-500 uppercase">--</span>
                    </div>
                    <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-800 tracking-tight">デイリーハビット</h1>
                </div>
                <button onclick="showResetModal()" title="今日のチェックをリセット" class="p-2.5 rounded-xl text-slate-400 hover:text-slate-600 hover:bg-slate-100 transition-colors">
                    <i class="fa-solid fa-rotate-right text-base"></i>
                </button>
            </div>

            <!-- Navigation Tabs -->
            <div class="flex bg-slate-200/60 p-1 rounded-2xl mb-4">
                <button onclick="switchTab('checklist')" id="tabChecklist" class="flex-1 py-2 text-xs sm:text-sm font-bold rounded-xl transition-all bg-white text-indigo-600 shadow-sm">
                    <i class="fa-solid fa-list-check mr-1.5"></i>今日のチェック
                </button>
                <button onclick="switchTab('chart')" id="tabChart" class="flex-1 py-2 text-xs sm:text-sm font-bold rounded-xl transition-all text-slate-500 hover:text-slate-700">
                    <i class="fa-solid fa-chart-column mr-1.5"></i>週間チャート
                </button>
            </div>

            <!-- Progress section (visible only in checklist tab) -->
            <div id="progressSection" class="bg-slate-50/80 p-4 rounded-2xl border border-slate-100">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-xs font-bold text-slate-500 uppercase tracking-wider">本日の進捗</span>
                    <span id="progressPercentage" class="text-xs font-extrabold text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded-full">0%</span>
                </div>
                <div class="w-full bg-slate-200/80 rounded-full h-3.5 overflow-hidden p-0.5">
                    <div id="progressBar" class="bg-gradient-to-r from-indigo-500 via-indigo-600 to-emerald-400 h-2.5 rounded-full w-0 transition-all duration-500 ease-out progress-glow"></div>
                </div>
                <div class="flex justify-between items-center mt-2 text-xs font-medium text-slate-500">
                    <span id="statusMessage">今日の習慣を完了させましょう！</span>
                    <span id="progressCount" class="font-bold text-slate-700">0 / 7 完了</span>
                </div>
            </div>
        </div>

        <!-- Checklist Tab View -->
        <div id="viewChecklist" class="space-y-4">
            <div id="congratsBanner" class="hidden glass-card celebrate-bounce rounded-3xl p-5 bg-gradient-to-r from-emerald-500 to-teal-600 text-white shadow-lg text-center border-none">
                <div class="inline-flex items-center justify-center w-12 h-12 bg-white/20 rounded-2xl mb-2 backdrop-blur-md">
                    <i class="fa-solid fa-trophy text-2xl text-amber-300"></i>
                </div>
                <h2 class="text-lg font-bold">素晴らしい！今日の全ての目標を達成しました！</h2>
                <p class="text-xs text-emerald-100 mt-1">健康で最高の1日になりましたね ✨</p>
            </div>

            <div id="checklist" class="space-y-3">
                <!-- Dynamically populated checklist items -->
            </div>
        </div>

        <!-- Chart Tab View -->
        <div id="viewChart" class="hidden space-y-4">
            <div class="glass-card rounded-3xl p-6 shadow-xl">
                <div class="flex justify-between items-center mb-4">
                    <div>
                        <h2 class="text-lg font-bold text-slate-800">過去7日間の達成率</h2>
                        <p class="text-xs text-slate-500">直近一週間の習慣継続推移</p>
                    </div>
                    <div class="text-right">
                        <span id="weeklyAverage" class="text-lg font-extrabold text-indigo-600">0%</span>
                        <div class="text-[10px] text-slate-400 uppercase font-bold">平均達成率</div>
                    </div>
                </div>

                <div class="relative w-full h-64 bg-white/60 p-4 rounded-2xl border border-slate-100">
                    <canvas id="weeklyChart"></canvas>
                </div>

                <div class="mt-4 grid grid-cols-2 gap-3">
                    <div class="bg-indigo-50/60 p-3 rounded-2xl border border-indigo-100 text-center">
                        <div id="totalCompletedWeek" class="text-xl font-extrabold text-indigo-600">0</div>
                        <div class="text-xs text-slate-500 font-medium mt-0.5">今週のクリア項目総数</div>
                    </div>
                    <div class="bg-emerald-50/60 p-3 rounded-2xl border border-emerald-100 text-center">
                        <div id="streakDays" class="text-xl font-extrabold text-emerald-600">0日</div>
                        <div class="text-xs text-slate-500 font-medium mt-0.5">継続日数</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Custom Reset Confirmation Modal -->
        <div id="resetModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
            <div class="glass-card rounded-3xl p-6 max-w-xs w-full shadow-2xl text-center transform transition-all">
                <div class="w-12 h-12 bg-rose-50 text-rose-500 rounded-2xl mx-auto flex items-center justify-center text-xl mb-3">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                </div>
                <h3 class="text-base font-bold text-slate-800 mb-1">リセットの確認</h3>
                <p class="text-xs text-slate-500 mb-5">本日のチェック状態をすべてリセットしますか？</p>
                <div class="flex gap-2">
                    <button onclick="closeResetModal()" class="flex-1 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-600 text-xs font-bold rounded-xl transition-colors">キャンセル</button>
                    <button onclick="confirmReset()" class="flex-1 py-2.5 bg-rose-500 hover:bg-rose-600 text-white text-xs font-bold rounded-xl transition-colors shadow-lg shadow-rose-500/30">リセットする</button>
                </div>
            </div>
        </div>

        <!-- Footer Info -->
        <footer class="mt-8 text-center text-xs text-slate-400 font-medium">
            日付が変わると自動で新しい一日の記録が始まります
        </footer>
    </div>

    <script>
        const tasks = [
            { id: 1, text: "水を飲む", icon: "fa-glass-water", color: "text-blue-500", bg: "bg-blue-50" },
            { id: 2, text: "ヨガ・体操をやる", icon: "fa-spa", color: "text-teal-500", bg: "bg-teal-50" },
            { id: 3, text: "走る", icon: "fa-person-running", color: "text-amber-500", bg: "bg-amber-50" },
            { id: 4, text: "体操", icon: "fa-child-reaching", color: "text-orange-500", bg: "bg-orange-50" },
            { id: 5, text: "お祈り", icon: "fa-hands-praying", color: "text-purple-500", bg: "bg-purple-50" },
            { id: 6, text: "7時間寝る", icon: "fa-bed", color: "text-indigo-500", bg: "bg-indigo-50" },
            { id: 7, text: "11時までに寝る", icon: "fa-moon", color: "text-sky-500", bg: "bg-sky-50" }
        ];

        const HISTORY_KEY = 'daily_habit_history_v2';
        let chartInstance = null;
        let previousAllCompleted = false;

        function getTodayString(dateObj = new Date()) {
            return `${dateObj.getFullYear()}-${String(dateObj.getMonth() + 1).padStart(2, '0')}-${String(dateObj.getDate()).padStart(2, '0')}`;
        }

        function updateDateDisplay() {
            const now = new Date();
            const days = ['日', '月', '火', '水', '木', '金', '土'];
            document.getElementById('dateDisplay').textContent = `${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日 (${days[now.getDay() * 1] || '日'})`;
        }

        function getAllHistory() {
            try {
                const data = localStorage.getItem(HISTORY_KEY);
                return data ? JSON.parse(data) : {};
            } catch (e) {
                console.error("Failed to load history", e);
                return {};
            }
        }

        function saveAllHistory(history) {
            try {
                localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
            } catch (e) {
                console.error("Failed to save history", e);
            }
        }

        function getTodayState() {
            const history = getAllHistory();
            const today = getTodayString();
            return history[today] || {};
        }

        function saveTodayState(state) {
            const history = getAllHistory();
            const today = getTodayString();
            history[today] = state;
            saveAllHistory(history);
        }

        function switchTab(tabName) {
            const btnChecklist = document.getElementById('tabChecklist');
            const btnChart = document.getElementById('tabChart');
            const viewChecklist = document.getElementById('viewChecklist');
            const viewChart = document.getElementById('viewChart');
            const progressSection = document.getElementById('progressSection');

            if (tabName === 'checklist') {
                btnChecklist.className = "flex-1 py-2 text-xs sm:text-sm font-bold rounded-xl transition-all bg-white text-indigo-600 shadow-sm";
                btnChart.className = "flex-1 py-2 text-xs sm:text-sm font-bold rounded-xl transition-all text-slate-500 hover:text-slate-700";
                viewChecklist.classList.remove('hidden');
                viewChart.classList.add('hidden');
                progressSection.style.display = 'block';
            } else {
                btnChart.className = "flex-1 py-2 text-xs sm:text-sm font-bold rounded-xl transition-all bg-white text-indigo-600 shadow-sm";
                btnChecklist.className = "flex-1 py-2 text-xs sm:text-sm font-bold rounded-xl transition-all text-slate-500 hover:text-slate-700";
                viewChart.classList.remove('hidden');
                viewChecklist.classList.add('hidden');
                progressSection.style.display = 'none';
                renderWeeklyChart();
            }
        }

        function renderChecklist() {
            const container = document.getElementById('checklist');
            const state = getTodayState();
            container.innerHTML = '';

            tasks.forEach(task => {
                const isChecked = !!state[task.id];

                const card = document.createElement('div');
                card.className = `check-card glass-card rounded-2xl p-4 flex items-center justify-between cursor-pointer border ${
                    isChecked ? 'checked bg-indigo-50/60 border-indigo-200' : 'border-white/80 hover:border-indigo-100'
                }`;

                card.innerHTML = `
                    <div class="flex items-center gap-3.5">
                        <div class="w-10 h-10 rounded-xl ${task.bg} ${task.color} flex items-center justify-center text-lg font-semibold shrink-0">
                            <i class="fa-solid ${task.icon}"></i>
                        </div>
                        <span class="text-sm sm:text-base font-semibold ${isChecked ? 'line-through text-slate-400' : 'text-slate-700'} transition-colors">
                            ${task.text}
                        </span>
                    </div>

                    <div class="custom-checkbox w-7 h-7 rounded-xl border-2 ${
                        isChecked ? 'border-indigo-600 bg-indigo-600' : 'border-slate-300 bg-white'
                    } flex items-center justify-center shrink-0">
                        <i class="fa-solid fa-check text-xs text-white check-icon"></i>
                    </div>
                `;

                card.addEventListener('click', () => toggleTask(task.id));
                container.appendChild(card);
            });
        }

        function toggleTask(id) {
            const state = getTodayState();
            state[id] = !state[id];
            saveTodayState(state);

            renderChecklist();
            updateProgress();
        }

        function showResetModal() {
            document.getElementById('resetModal').classList.remove('hidden');
        }

        function closeResetModal() {
            document.getElementById('resetModal').classList.add('hidden');
        }

        function confirmReset() {
            saveTodayState({});
            closeResetModal();
            renderChecklist();
            updateProgress();
        }

        function triggerConfetti() {
            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 80,
                    spread: 70,
                    origin: { y: 0.6 }
                });
            }
        }

        function updateProgress() {
            const state = getTodayState();
            const total = tasks.length;
            const completedCount = tasks.filter(task => !!state[task.id]).length;
            const percentage = Math.round((completedCount / total) * 100);

            document.getElementById('progressBar').style.width = `${percentage}%`;
            document.getElementById('progressPercentage').textContent = `${percentage}%`;
            document.getElementById('progressCount').textContent = `${completedCount} / ${total} 完了`;

            const statusMsg = document.getElementById('statusMessage');
            const congratsBanner = document.getElementById('congratsBanner');

            if (completedCount === 0) {
                statusMsg.textContent = "今日の習慣を始めましょう！";
                congratsBanner.classList.add('hidden');
                previousAllCompleted = false;
            } else if (completedCount === total) {
                statusMsg.textContent = "完璧です！コンプリート！ 🎉";
                congratsBanner.classList.remove('hidden');

                if (!previousAllCompleted) {
                    triggerConfetti();
                    previousAllCompleted = true;
                }
            } else {
                statusMsg.textContent = "順調です！その調子！";
                congratsBanner.classList.add('hidden');
                previousAllCompleted = false;
            }
        }

        function renderWeeklyChart() {
            const history = getAllHistory();
            const labels = [];
            const percentages = [];
            let totalCompletedSum = 0;
            let activeDaysCount = 0;
            let currentStreak = 0;
            let streakCounting = true;

            // Generate past 7 days (from 6 days ago to today)
            for (let i = 6; i >= 0; i--) {
                const d = new Date();
                d.setDate(d.getDate() - i);
                const dateStr = getTodayString(d);
                const labelName = `${d.getMonth() + 1}/${d.getDate()}`;
                labels.push(labelName);

                const dayState = history[dateStr] || {};
                const completedCount = tasks.filter(task => !!dayState[task.id]).length;
                const pct = Math.round((completedCount / tasks.length) * 100);
                percentages.push(pct);

                totalCompletedSum += completedCount;

                if (completedCount > 0) {
                    activeDaysCount++;
                }

                if (streakCounting) {
                    if (completedCount > 0 || i === 0) {
                        if (completedCount === tasks.length) {
                            currentStreak++;
                        } else if (i !== 0) {
                            // If past day incomplete, stop streak counting
                            streakCounting = false;
                        }
                    }
                }
            }

            const avgPct = Math.round(percentages.reduce((a, b) => a + b, 0) / 7);
            document.getElementById('weeklyAverage').textContent = `${avgPct}%`;
            document.getElementById('totalCompletedWeek').textContent = `${totalCompletedSum}個`;
            document.getElementById('streakDays').textContent = `${currentStreak}日`;

            const ctx = document.getElementById('weeklyChart').getContext('2d');
            if (chartInstance) {
                chartInstance.destroy();
            }

            chartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '達成率 (%)',
                        data: percentages,
                        backgroundColor: percentages.map(p => p === 100 ? '#10b981' : '#6366f1'),
                        borderRadius: 8,
                        barThickness: 'flex',
                        maxBarThickness: 32
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: true,
                            max: 100,
                            ticks: {
                                callback: function(value) {
                                    return value + '%';
                                },
                                font: { size: 10 }
                            },
                            grid: { color: 'rgba(0, 0, 0, 0.04)' }
                        },
                        x: {
                            grid: { display: false },
                            ticks: { font: { size: 10 } }
                        }
                    },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return `達成率: ${context.raw}%`;
                                }
                            }
                        }
                    }
                }
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            updateDateDisplay();
            renderChecklist();
            updateProgress();
        });
    </script>
</body>
</html>
